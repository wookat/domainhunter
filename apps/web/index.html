    <!-- 自托管字体（latin 子集，可变字重）：Inter 400..800 / JetBrains Mono 400..700，OFL 许可（见 /fonts/OFL.txt）。
         中文正文走系统字体栈（PingFang SC / Noto Sans SC），无需自托管中文字体。
         preload Inter latin 可变文件（所有字重共用），首绘前就绪，避免 swap 重绘推迟 LCP -->
    <link rel="preload" as="font" type="font/woff2" crossorigin href="/fonts/inter-latin-var.woff2" />
    <style>@font-face{font-family:'Inter';font-style:normal;font-weight:400 800;font-display:swap;src:url(/fonts/inter-latin-var.woff2) format('woff2');unicode-range:U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;} @font-face{font-family:'JetBrains Mono';font-style:normal;font-weight:400 700;font-display:swap;src:url(/fonts/jetbrains-mono-latin-var.woff2) format('woff2');unicode-range:U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;}</style>
    <script>
      try {
        if (localStorage.getItem("domainhunter:theme") === "light") {
          document.documentElement.classList.add("light");
        }
      } catch (e) {}
    </script>
    <script>
      // 缓存的旧 HTML 引用的 hashed JS 在新部署后可能 404：主 bundle 加载失败时强制刷新一次拿新版本
      window.addEventListener(
        "error",
        function (e) {
          var el = e.target;
          if (!el || el.tagName !== "SCRIPT" || !/\/assets\//.test(el.src || "")) return;
          try {
            if (sessionStorage.getItem("dh:htmlReloaded")) return;
            sessionStorage.setItem("dh:htmlReloaded", "1");
          } catch (err) {}
          location.reload();
        },
        true
      );
    </script>
