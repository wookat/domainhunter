name: content-guard

on:
  pull_request:
  push:
    branches:
      - deploy/r192-r195

jobs:
  content-counts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: 内容计数防回滚校验
        run: node scripts/check-content-counts.mjs
      - name: hub 索引一致性校验
        run: node scripts/gen-hub-index.mjs --check
